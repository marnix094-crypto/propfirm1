server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed assets can be cached forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Compete widgets (D108) may be framed by operator websites: the edge adds
  # `Content-Security-Policy: frame-ancestors <widget websites>` from /internal/route.
  location ~ ^/[a-z]{2}/compete/widget/ {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    try_files $uri /index.html;
  }

  # SPA fallback. Everything else may not be framed by other sites (clickjacking).
  location / {
    add_header Content-Security-Policy "frame-ancestors 'self'";
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    try_files $uri /index.html;
  }
}
