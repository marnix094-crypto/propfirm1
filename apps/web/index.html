<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Daily Funded</title>
    <script>
      // Apply the stored theme before first paint (no flash).
      // Website: dark by default (brand-theme). Platform + auth pages: always light (D79).
      (function () {
        var d = document.documentElement;
        // Platform pages (dashboard, trading, login/sign-up) are light-only.
        var platform =
          /^\/(en|nl|es)\/(app|login|register|forgot-password|reset-password|verify-email)(\/|$)/.test(
            location.pathname,
          );
        d.dataset.surface = platform ? 'platform' : 'site';
        var t = null;
        try {
          t = localStorage.getItem('brand-theme');
        } catch (e) {}
        d.dataset.theme = platform || t === 'light' ? 'light' : 'dark';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
